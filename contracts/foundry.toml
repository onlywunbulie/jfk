[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@safe/=lib/safe-smart-account/contracts/",
]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# The contract is the one place a bug costs real money, so CI runs the
# property tests much harder than a local edit-and-check loop does.
[profile.ci.fuzz]
runs = 20000

[profile.ci.invariant]
runs = 1024
depth = 128

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
